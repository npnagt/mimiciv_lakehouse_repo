[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic-lakehouse"
version = "0.1.0"
description = "Create an S3 bucket, upload CSV data, and trigger an AWS Glue crawler"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
dependencies = [
  "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]
# for measure_native_vs_external_join.py (P5.1) -- the external-compute arm
benchmark = [
  "duckdb>=1.0",
  "pyarrow>=15.0",
]
# for validate_rq2_queries.py --execute: one Excel tab per query's result set
reports = [
  "openpyxl>=3.1",
]

[project.scripts]
mimic-lakehouse = "mimic_lakehouse.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
